<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport"><link href="/favicon.ico" rel="icon" sizes="any"><link href="/assets/img/favicon-32.png" rel="icon" sizes="32x32" type="image/png"><link href="/assets/img/apple-touch-icon.png" rel="apple-touch-icon">
<title>Profil UPT - Panel UPT Karya WBP</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: "#00102d",
          "primary-container": "#0f254a",
          "surface-canvas": "#F4F6FA",
          "surface-card": "#FFFFFF",
          "border-subtle": "#E2E8F0",
        },
        fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] },
      },
    },
  };
</script>
<style>body { font-family: "Plus Jakarta Sans", sans-serif; }</style>
</head>
<body class="bg-surface-canvas text-primary min-h-screen">
<header class="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-border-subtle shadow-sm transition-all">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
<div class="flex items-center gap-3.5 shrink-0">
<div class="w-11 h-11 rounded-xl overflow-hidden shadow-md shadow-primary/20 ring-1 ring-white/20 bg-white">
<img src="/assets/img/logo-kemenimipas.png" alt="Logo Kementerian Imigrasi dan Pemasyarakatan" class="w-full h-full object-contain">
</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-2">
<span class="font-bold text-lg text-primary tracking-tight leading-tight">Karya WBP Jabar Juara</span>
<span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-amber-100 text-amber-900 border border-amber-300">Resmi</span>
</div>
<span class="text-xs font-medium text-on-surface-variant leading-normal truncate" id="header-upt-nama">Memuat...</span>
</div>
</div>
<nav class="hidden md:flex items-center gap-1.5 p-1 bg-surface-container rounded-xl border border-border-subtle/80 ml-auto">
<a class="px-4 py-2 rounded-lg text-sm font-semibold text-on-surface-variant hover:text-primary hover:bg-white transition-all" href="/">Lihat Katalog</a>
<a href="/dashboard" data-page="dashboard" class="header-link px-4 py-2 rounded-lg text-sm font-semibold text-on-surface-variant hover:text-primary hover:bg-white transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">dashboard</span>Dashboard
</a>
<a href="/dashboard-produk" data-page="produk" class="header-link px-4 py-2 rounded-lg text-sm font-semibold text-on-surface-variant hover:text-primary hover:bg-white transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">inventory_2</span>Produk
</a>
<a href="/dashboard-penjualan" data-page="penjualan" class="header-link px-4 py-2 rounded-lg text-sm font-semibold text-on-surface-variant hover:text-primary hover:bg-white transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">point_of_sale</span>Penjualan
</a>
<a href="/dashboard-profil" data-page="profil" class="header-link px-4 py-2 rounded-lg text-sm font-semibold text-on-surface-variant hover:text-primary hover:bg-white transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">storefront</span>Profil UPT
</a>
</nav>
<div class="flex items-center gap-3 shrink-0">
<div class="hidden lg:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-50 border border-amber-200 shadow-xs">
<span class="material-symbols-outlined text-amber-700 text-[18px]">verified_user</span>
<span class="text-xs font-bold text-amber-900 tracking-wide uppercase">Portal Resmi Terverifikasi</span>
</div>
<button id="header-logout-btn" class="flex items-center gap-2 px-3.5 py-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-primary font-semibold text-xs tracking-wide transition-colors border border-border-subtle">
<span class="material-symbols-outlined text-primary text-[18px]">logout</span>
<span>Keluar</span>
</button>
</div>
</div>
</header>

<main class="min-h-screen pt-24 p-6 sm:p-8 max-w-2xl">
    <h1 class="font-extrabold text-xl text-primary mb-6">Profil UPT</h1>

    <div class="bg-white rounded-2xl shadow-sm border border-border-subtle p-5 flex flex-col sm:flex-row sm:items-end gap-3">
      <div class="flex-1">
        <label class="block text-xs font-bold uppercase tracking-wide text-slate-600 mb-1.5" for="whatsapp-number">Nomor WhatsApp UPT (untuk tombol pesan di katalog)</label>
        <input id="whatsapp-number" type="text" placeholder="Contoh: 628123456789 (tanpa +/0 di depan)"
          class="w-full px-3 py-2.5 rounded-lg border border-border-subtle text-sm focus:outline-none focus:ring-2 focus:ring-primary-container">
      </div>
      <button id="save-whatsapp-btn" type="button" class="px-5 py-2.5 rounded-lg bg-primary-container text-white font-bold text-sm hover:bg-primary transition shrink-0">Simpan Nomor WA</button>
    </div>
    <p id="whatsapp-message" class="hidden text-xs font-semibold mt-2 px-1"></p>
    <div class="bg-white rounded-2xl shadow-sm border border-border-subtle p-5 mt-5">
      <h2 class="font-bold text-sm text-primary mb-3">Ganti Password</h2>
      <div class="flex flex-col sm:flex-row sm:items-end gap-3">
        <div class="flex-1">
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-600 mb-1.5" for="new-password">Password Baru</label>
          <input id="new-password" type="password" placeholder="Minimal 6 karakter"
            class="w-full px-3 py-2.5 rounded-lg border border-border-subtle text-sm focus:outline-none focus:ring-2 focus:ring-primary-container">
        </div>
        <div class="flex-1">
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-600 mb-1.5" for="confirm-password">Konfirmasi Password Baru</label>
          <input id="confirm-password" type="password" placeholder="Ulangi password baru"
            class="w-full px-3 py-2.5 rounded-lg border border-border-subtle text-sm focus:outline-none focus:ring-2 focus:ring-primary-container">
        </div>
        <button id="change-password-btn" type="button" class="px-5 py-2.5 rounded-lg bg-primary-container text-white font-bold text-sm hover:bg-primary transition shrink-0 disabled:opacity-50">Ubah Password</button>
      </div>
      <p id="password-message" class="hidden text-xs font-semibold mt-2 px-1"></p>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/upt-dashboard.js"></script>
<script>
  let currentUptId = null;

  document.getElementById("save-whatsapp-btn").addEventListener("click", async () => {
    const msgEl = document.getElementById("whatsapp-message");
    const value = document.getElementById("whatsapp-number").value.trim();

    if (!currentUptId) {
      msgEl.textContent = "Tunggu data akun selesai dimuat, lalu coba lagi.";
      msgEl.className = "text-xs font-semibold mt-2 px-1 text-red-600";
      msgEl.classList.remove("hidden");
      return;
    }

    if (!/^62\d{8,13}$/.test(value)) {
      msgEl.textContent = "Format nomor salah. Gunakan format 62xxxxxxxxxx (tanpa +/0 di depan).";
      msgEl.className = "text-xs font-semibold mt-2 px-1 text-red-600";
      msgEl.classList.remove("hidden");
      return;
    }

    const { error } = await supabaseClient.from("upt").update({ whatsapp: value }).eq("id", currentUptId);
    msgEl.classList.remove("hidden");
    if (error) {
      msgEl.textContent = "Gagal menyimpan: " + error.message;
      msgEl.className = "text-xs font-semibold mt-2 px-1 text-red-600";
    } else {
      msgEl.textContent = "Nomor WhatsApp berhasil disimpan.";
      msgEl.className = "text-xs font-semibold mt-2 px-1 text-emerald-600";
    }
  });

  document.getElementById("change-password-btn").addEventListener("click", async () => {
    const btn = document.getElementById("change-password-btn");
    const msgEl = document.getElementById("password-message");
    const newPassword = document.getElementById("new-password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    function showPasswordMessage(text, isError) {
      msgEl.textContent = text;
      msgEl.className = "text-xs font-semibold mt-2 px-1 " + (isError ? "text-red-600" : "text-emerald-600");
      msgEl.classList.remove("hidden");
    }

    if (!newPassword || !confirmPassword) {
      showPasswordMessage("Isi kedua field password terlebih dahulu.", true);
      return;
    }

    if (newPassword.length < 6) {
      showPasswordMessage("Password baru minimal 6 karakter.", true);
      return;
    }

    if (newPassword !== confirmPassword) {
      showPasswordMessage("Password baru dan konfirmasi tidak cocok.", true);
      return;
    }

    btn.disabled = true;
    btn.textContent = "Menyimpan...";

    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    btn.disabled = false;
    btn.textContent = "Ubah Password";

    if (error) {
      showPasswordMessage("Gagal mengubah password: " + error.message, true);
      return;
    }

    showPasswordMessage("Password berhasil diubah.", false);
    document.getElementById("new-password").value = "";
    document.getElementById("confirm-password").value = "";
  });

  (async () => {
    const uptInfo = await requireUptSession();
    if (!uptInfo) return;
    currentUptId = uptInfo.uptId;
    renderHeader("profil", uptInfo);
    document.getElementById("whatsapp-number").value = uptInfo.whatsapp || "";
  })();
</script>
</body>
</html>
