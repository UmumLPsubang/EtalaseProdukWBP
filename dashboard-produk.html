<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Produk - Panel UPT Karya WBP</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: "#00102d",
          "primary-container": "#0f254a",
          "surface-canvas": "#F4F6FA",
          "surface-card": "#FFFFFF",
          "border-subtle": "#E2E8F0",
        },
        fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] },
      },
    },
  };
</script>
<style>body { font-family: "Plus Jakarta Sans", sans-serif; }</style>
</head>
<body class="bg-surface-canvas text-primary min-h-screen">
<header class="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-border-subtle shadow-sm transition-all">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
<div class="flex items-center gap-3.5 shrink-0">
<div class="w-11 h-11 rounded-xl overflow-hidden shadow-md shadow-primary/20 ring-1 ring-white/20 bg-white">
<img src="/assets/img/logo-kemenimipas.png" alt="Logo Kementerian Imigrasi dan Pemasyarakatan" class="w-full h-full object-contain">
</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-2">
<span class="font-bold text-lg text-primary tracking-tight leading-tight">Karya WBP Jabar Juara</span>
<span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase bg-amber-100 text-amber-900 border border-amber-300">Resmi</span>
</div>
<span class="text-xs font-medium text-on-surface-variant leading-normal truncate" id="header-upt-nama">Memuat...</span>
</div>
</div>
<nav class="hidden md:flex items-center gap-1.5 p-1 bg-surface-container rounded-xl border border-border-subtle/80 ml-auto">
<a class="px-4 py-2 rounded-lg text-sm font-semibold text-on-surface-variant hover:text-primary hover:bg-white transition-all" href="/">Lihat Katalog</a>
<a href="/dashboard" data-page="dashboard" class="header-link px-4 py-2 rounded-lg text-sm font-semibold text-on-surface-variant hover:text-primary hover:bg-white transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">dashboard</span>Dashboard
</a>
<a href="/dashboard-produk" data-page="produk" class="header-link px-4 py-2 rounded-lg text-sm font-semibold text-on-surface-variant hover:text-primary hover:bg-white transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">inventory_2</span>Produk
</a>
<a href="/dashboard-penjualan" data-page="penjualan" class="header-link px-4 py-2 rounded-lg text-sm font-semibold text-on-surface-variant hover:text-primary hover:bg-white transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">point_of_sale</span>Penjualan
</a>
<a href="/dashboard-profil" data-page="profil" class="header-link px-4 py-2 rounded-lg text-sm font-semibold text-on-surface-variant hover:text-primary hover:bg-white transition-all flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">storefront</span>Profil UPT
</a>
</nav>
<div class="flex items-center gap-3 shrink-0">
<div class="hidden lg:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-50 border border-amber-200 shadow-xs">
<span class="material-symbols-outlined text-amber-700 text-[18px]">verified_user</span>
<span class="text-xs font-bold text-amber-900 tracking-wide uppercase">Portal Resmi Terverifikasi</span>
</div>
<button id="header-logout-btn" class="flex items-center gap-2 px-3.5 py-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-primary font-semibold text-xs tracking-wide transition-colors border border-border-subtle">
<span class="material-symbols-outlined text-primary text-[18px]">logout</span>
<span>Keluar</span>
</button>
</div>
</div>
</header>

<main class="min-h-screen pt-24 p-6 sm:p-8 max-w-6xl">
    <h1 class="font-extrabold text-xl text-primary mb-6">Produk</h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
    <form id="produk-form" class="bg-white rounded-2xl shadow-sm border border-border-subtle p-6 space-y-5">
      <h2 class="font-bold text-base text-primary" id="produk-form-title">Tambah Produk</h2>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-slate-600 mb-1.5" for="nama">Nama Produk *</label>
        <input id="nama" name="nama" type="text" required maxlength="150" placeholder="Misal: Kopi Robusta Tangkuban Parahu"
          class="w-full px-3 py-2.5 rounded-lg border border-border-subtle text-sm focus:outline-none focus:ring-2 focus:ring-primary-container">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-600 mb-1.5" for="kategori">Kategori *</label>
          <select id="kategori" name="kategori" required
            class="w-full px-3 py-2.5 rounded-lg border border-border-subtle text-sm focus:outline-none focus:ring-2 focus:ring-primary-container">
            <option value="" disabled selected>Pilih kategori</option>
            <option value="Kriya">Kriya</option>
            <option value="Tekstil">Tekstil</option>
            <option value="Kuliner">Kuliner</option>
            <option value="Mebel">Mebel</option>
            <option value="Pertanian">Pertanian</option>
            <option value="Jasa">Jasa</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-600 mb-1.5" for="harga">Harga (Rp) *</label>
          <input id="harga" name="harga" type="number" min="0" step="500" required placeholder="50000"
            class="w-full px-3 py-2.5 rounded-lg border border-border-subtle text-sm focus:outline-none focus:ring-2 focus:ring-primary-container">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-slate-600 mb-1.5" for="deskripsi">Deskripsi</label>
        <textarea id="deskripsi" name="deskripsi" rows="3" maxlength="500" placeholder="Deskripsi singkat produk (opsional)"
          class="w-full px-3 py-2.5 rounded-lg border border-border-subtle text-sm focus:outline-none focus:ring-2 focus:ring-primary-container"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-600 mb-1.5" for="shopee-link">Link Shopee (opsional)</label>
          <input id="shopee-link" type="url" placeholder="https://shopee.co.id/..."
            class="w-full px-3 py-2.5 rounded-lg border border-border-subtle text-sm focus:outline-none focus:ring-2 focus:ring-primary-container">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wide text-slate-600 mb-1.5" for="tokopedia-link">Link Tokopedia (opsional)</label>
          <input id="tokopedia-link" type="url" placeholder="https://www.tokopedia.com/..."
            class="w-full px-3 py-2.5 rounded-lg border border-border-subtle text-sm focus:outline-none focus:ring-2 focus:ring-primary-container">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-slate-600 mb-1.5" for="foto">Foto Produk</label>
        <input id="foto" name="foto" type="file" accept="image/png,image/jpeg,image/webp"
          class="w-full text-sm file:mr-3 file:px-3 file:py-2 file:rounded-lg file:border-0 file:bg-slate-100 file:text-slate-700 file:font-semibold file:text-xs hover:file:bg-slate-200">
        <p class="text-[11px] text-slate-500 mt-1">Maks 2MB. Format: JPG, PNG, atau WebP.</p>
      </div>

      <div id="form-message" class="hidden text-sm font-semibold rounded-lg px-3 py-2"></div>

      <div class="flex gap-3">
        <button type="submit" id="submit-btn"
          class="flex-1 py-3 rounded-lg bg-primary-container text-white font-bold text-sm hover:bg-primary transition disabled:opacity-50 disabled:cursor-not-allowed">
          Simpan Produk
        </button>
        <button type="button" id="cancel-edit-btn"
          class="hidden px-5 py-3 rounded-lg bg-slate-100 text-slate-700 font-bold text-sm hover:bg-slate-200 transition">
          Batal Edit
        </button>
      </div>
    </form>

    <section class="bg-white rounded-2xl shadow-sm border border-border-subtle p-6">
      <h2 class="font-bold text-base text-primary mb-4">Daftar Produk</h2>
      <div id="produk-list" class="space-y-3">
        <p class="text-sm text-slate-400 text-center py-6">Memuat daftar produk...</p>
      </div>
    </section>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/upt-dashboard.js"></script>
<script>
  let currentUptId = null;
  let editingProdukId = null;
  let produkListCache = [];
  const form = document.getElementById("produk-form");
  const submitBtn = document.getElementById("submit-btn");
  const messageBox = document.getElementById("form-message");

  function enterEditMode(p) {
    editingProdukId = p.id;
    document.getElementById("produk-form-title").textContent = "Edit Produk";
    submitBtn.textContent = "Simpan Perubahan";
    document.getElementById("cancel-edit-btn").classList.remove("hidden");

    document.getElementById("nama").value = p.nama;
    document.getElementById("kategori").value = p.kategori || "";
    document.getElementById("harga").value = p.harga;
    document.getElementById("deskripsi").value = p.deskripsi || "";
    document.getElementById("shopee-link").value = p.shopee_link || "";
    document.getElementById("tokopedia-link").value = p.tokopedia_link || "";
    document.getElementById("foto").value = "";

    form.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function exitEditMode() {
    editingProdukId = null;
    document.getElementById("produk-form-title").textContent = "Tambah Produk";
    submitBtn.textContent = "Simpan Produk";
    document.getElementById("cancel-edit-btn").classList.add("hidden");
    form.reset();
    messageBox.classList.add("hidden");
  }

  document.getElementById("cancel-edit-btn").addEventListener("click", exitEditMode);

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function formatRupiah(n) {
    return "Rp " + Number(n).toLocaleString("id-ID");
  }

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "text-sm font-semibold rounded-lg px-3 py-2 " +
      (type === "error"
        ? "bg-red-50 text-red-700 border border-red-200"
        : "bg-emerald-50 text-emerald-700 border border-emerald-200");
    messageBox.classList.remove("hidden");
  }

  async function uploadFoto(file, uptId) {
    const ext = file.name.split(".").pop();
    const path = `${uptId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error: uploadError } = await supabaseClient.storage
      .from("produk-images")
      .upload(path, file);
    if (uploadError) throw uploadError;

    const { data: urlData } = supabaseClient.storage.from("produk-images").getPublicUrl(path);
    return urlData.publicUrl;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Menyimpan...";
    messageBox.classList.add("hidden");

    if (!currentUptId) {
      showMessage("Tunggu data akun selesai dimuat, lalu coba lagi.", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = editingProdukId ? "Simpan Perubahan" : "Simpan Produk";
      return;
    }

    const shopeeLink = document.getElementById("shopee-link").value.trim();
    const tokopediaLink = document.getElementById("tokopedia-link").value.trim();
    const urlPattern = /^https:\/\/.+/;

    if (shopeeLink && !urlPattern.test(shopeeLink)) {
      showMessage("Link Shopee harus diawali https://", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = editingProdukId ? "Simpan Perubahan" : "Simpan Produk";
      return;
    }
    if (tokopediaLink && !urlPattern.test(tokopediaLink)) {
      showMessage("Link Tokopedia harus diawali https://", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = editingProdukId ? "Simpan Perubahan" : "Simpan Produk";
      return;
    }

    try {
      const nama = document.getElementById("nama").value.trim();
      const kategori = document.getElementById("kategori").value;
      const harga = parseFloat(document.getElementById("harga").value);
      const deskripsi = document.getElementById("deskripsi").value.trim() || null;
      const fotoFile = document.getElementById("foto").files[0];

      let image_url = null;
      if (fotoFile) {
        if (fotoFile.size > 2 * 1024 * 1024) {
          throw new Error("Ukuran foto melebihi 2MB.");
        }
        image_url = await uploadFoto(fotoFile, currentUptId);
      }

      const payload = {
        nama,
        kategori,
        harga,
        deskripsi,
        shopee_link: shopeeLink || null,
        tokopedia_link: tokopediaLink || null,
      };
      if (image_url) payload.image_url = image_url;

      if (editingProdukId) {
        const { data: updateData, error: updateError } = await supabaseClient
          .from("produk")
          .update(payload)
          .eq("id", editingProdukId)
          .select();
        if (updateError) throw updateError;
        if (!updateData || updateData.length === 0) {
          showMessage("Produk tidak ditemukan atau bukan milik Anda. Mungkin sudah dihapus.", "error");
          exitEditMode();
          loadProdukList(currentUptId);
          submitBtn.disabled = false;
          submitBtn.textContent = "Simpan Produk";
          return;
        }
        showMessage("Perubahan berhasil disimpan.", "success");
        exitEditMode();
      } else {
        const { error: insertError } = await supabaseClient.from("produk").insert({
          ...payload,
          upt_id: currentUptId,
          status: "aktif",
        });
        if (insertError) throw insertError;
        showMessage("Produk berhasil disimpan.", "success");
        form.reset();
      }

      loadProdukList(currentUptId);
    } catch (err) {
      console.error(err);
      showMessage("Gagal menyimpan produk: " + (err.message || "terjadi kesalahan"), "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = editingProdukId ? "Simpan Perubahan" : "Simpan Produk";
    }
  });

  function renderProdukListItem(p) {
    const statusBadge = p.status === "aktif"
      ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Aktif</span>'
      : '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-500 border border-slate-200">Nonaktif</span>';
    const toggleLabel = p.status === "aktif" ? "Nonaktifkan" : "Aktifkan";
    const img = p.image_url
      ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.nama)}" class="w-12 h-12 rounded-lg object-cover border border-border-subtle">`
      : `<div class="w-12 h-12 rounded-lg bg-surface-canvas border border-border-subtle flex items-center justify-center text-[9px] text-slate-400 text-center">No Foto</div>`;

    return `
      <div class="flex items-center gap-3 p-3 border border-border-subtle rounded-xl">
        ${img}
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-bold text-sm text-primary truncate">${escapeHtml(p.nama)}</span>
            ${statusBadge}
          </div>
          <div class="text-xs text-slate-500">${escapeHtml(p.kategori || "-")} &middot; ${formatRupiah(p.harga)}</div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button class="toggle-status-btn px-3 py-1.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-primary text-xs font-bold transition border border-border-subtle" data-id="${p.id}" data-current-status="${p.status}">${toggleLabel}</button>
          <button class="edit-produk-btn px-3 py-1.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-primary text-xs font-bold transition border border-border-subtle" data-id="${p.id}">Edit</button>
          <button class="delete-produk-btn px-3 py-1.5 rounded-lg bg-red-50 hover:bg-red-100 text-red-700 text-xs font-bold transition border border-red-200" data-id="${p.id}" data-nama="${escapeHtml(p.nama)}">Hapus</button>
        </div>
      </div>`;
  }

  async function loadProdukList(uptId) {
    const container = document.getElementById("produk-list");
    const { data, error } = await supabaseClient
      .from("produk")
      .select("id, nama, kategori, harga, deskripsi, image_url, status, shopee_link, tokopedia_link")
      .eq("upt_id", uptId)
      .order("created_at", { ascending: false });

    if (error) {
      container.innerHTML = '<p class="text-sm text-red-500 text-center py-6">Gagal memuat daftar produk.</p>';
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">Belum ada produk terdaftar.</p>';
      return;
    }

    produkListCache = data;
    container.innerHTML = data.map(renderProdukListItem).join("");

    container.querySelectorAll(".toggle-status-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        const newStatus = btn.dataset.currentStatus === "aktif" ? "nonaktif" : "aktif";
        btn.disabled = true;
        const { data: updateData, error: updateError } = await supabaseClient.from("produk").update({ status: newStatus }).eq("id", id).select();
        if (updateError) {
          alert("Gagal mengubah status: " + updateError.message);
          btn.disabled = false;
          return;
        }
        if (!updateData || updateData.length === 0) {
          alert("Perubahan tidak tersimpan (produk mungkin sudah tidak ada atau bukan milik Anda).");
          btn.disabled = false;
          return;
        }
        loadProdukList(uptId);
      });
    });

    container.querySelectorAll(".edit-produk-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const produk = produkListCache.find((item) => item.id === btn.dataset.id);
        if (produk) enterEditMode(produk);
      });
    });

    container.querySelectorAll(".delete-produk-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        const nama = btn.dataset.nama;
        const confirmed = confirm(`Yakin hapus "${nama}"? Transaksi lama yang pernah pakai produk ini akan kehilangan nama produknya. Tindakan ini tidak bisa dibatalkan.`);
        if (!confirmed) return;
        btn.disabled = true;
        const { data: deleteData, error: deleteError } = await supabaseClient.from("produk").delete().eq("id", id).select();
        if (deleteError) {
          alert("Gagal menghapus produk: " + deleteError.message);
          btn.disabled = false;
          return;
        }
        if (!deleteData || deleteData.length === 0) {
          alert("Produk tidak terhapus (mungkin sudah tidak ada atau bukan milik Anda).");
          btn.disabled = false;
          return;
        }
        if (editingProdukId === id) {
          exitEditMode();
        }
        loadProdukList(uptId);
      });
    });
  }

  (async () => {
    const uptInfo = await requireUptSession();
    if (!uptInfo) return;
    currentUptId = uptInfo.uptId;
    renderHeader("produk", uptInfo);
    loadProdukList(currentUptId);
  })();
</script>
</body>
</html>
